name: 每小时更新并发布榜单

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: spotlight-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'JupiterTheWarlock/SpotlightRank'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: 检查部署配置
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '缺少 CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '缺少 CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - run: |
          node --check public/app.js
          node --test
      - name: 完整采集后替换榜单
        run: node scripts/collect-data.mjs
      - name: 构建纯静态站点
        run: node scripts/build-pages.mjs
      - name: 只提交榜单数据
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "更新聚光灯榜单 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
          fi
      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.107.0 pages deploy dist/pages --project-name spotlight-rank-2026 --branch main --commit-hash "$(git rev-parse HEAD)" --commit-dirty=false
